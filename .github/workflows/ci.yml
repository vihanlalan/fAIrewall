name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v tests

  policy-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check policy fixtures from a clean package install
        run: |
          python -m pip install ".[dev]"
          cd "$RUNNER_TEMP"
          fairewall policy-suite "$GITHUB_WORKSPACE/examples/refunds/policy.json" "$GITHUB_WORKSPACE/examples/refunds/suite.json" --target both --junit policy-suite.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-suite
          path: ${{ runner.temp }}/policy-suite.xml

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/ || true
