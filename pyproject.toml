[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairewall"
version = "0.2.0"
description = "Enterprise AI governance SDK: deterministic security firewall for autonomous AI agents with platform adapters for Zapier, Microsoft Copilot Studio, Salesforce Agentforce, WhatsApp/Haptik, and UiPath."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "fAIrewall" }]
keywords = ["llm", "agent", "security", "prompt-injection", "firewall", "guardrails", "governance", "sdk", "enterprise"]
dependencies = []

[project.optional-dependencies]
proxy  = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
yaml   = ["PyYAML>=6.0"]
ml     = ["onnxruntime>=1.16", "tokenizers>=0.15", "numpy>=1.24"]
# Platform integration extras (all require the proxy extra)
zapier     = ["fairewall[proxy]", "httpx>=0.27"]
copilot    = ["fairewall[proxy]", "httpx>=0.27"]
salesforce = ["fairewall[proxy]", "httpx>=0.27"]
haptik     = ["fairewall[proxy]", "httpx>=0.27"]
uipath     = ["fairewall[proxy]", "httpx>=0.27"]
# Meta-extra: everything
sdk = ["fairewall[proxy,yaml,zapier,copilot,salesforce,haptik,uipath]"]
dev = ["pytest>=7.0", "fastapi>=0.110", "httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
fairewall = "fairewall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fairewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
