[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairewall"
version = "0.1.0"
description = "A deterministic security firewall for autonomous AI agents: inbound semantic guard + outbound tool-call circuit breaker with a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "fAIrewall" }]
keywords = ["llm", "agent", "security", "prompt-injection", "firewall", "guardrails"]
dependencies = []

[project.optional-dependencies]
proxy = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7.0", "fastapi>=0.110", "httpx>=0.27", "PyYAML>=6.0"]

[project.scripts]
fairewall = "fairewall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fairewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
